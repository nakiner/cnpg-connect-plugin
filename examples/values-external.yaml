# Alternative to a TLS Gateway: TCP TLS passthrough to the plugin.
# Supply a publicly trusted server certificate for topology.example.com
# in this Secret; CNPG-I certificates still use the chart's private CA.
fullnameOverride: cnpg-connect
watchNamespace: databases
application:
  service:
    type: LoadBalancer
    port: 443
    annotations: {}
    loadBalancerSourceRanges:
      - 192.0.2.0/24 # Replace with your applications' source CIDRs.
tls:
  application:
    existingSecret: connect-public-discovery-tls
# No discovery token is required. PostgreSQL endpoints are configured
# separately on the Cluster when clients cannot reach its Pod network.

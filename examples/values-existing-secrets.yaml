# All named Secrets must exist in the operator/release namespace.
# Use a publicly trusted discovery certificate to avoid per-app CA setup.
fullnameOverride: cnpg-connect
watchNamespace: databases
tls:
  certManager:
    enabled: false
  plugin:
    existingServerSecret: connect-plugin-server-tls
    existingClientSecret: connect-operator-client-tls
    clientCASecret: connect-operator-client-tls
    # Default expects a CA bundle; use tls.crt to trust the client leaf directly.
    clientCAKey: ca.crt
  application:
    existingSecret: connect-application-tls

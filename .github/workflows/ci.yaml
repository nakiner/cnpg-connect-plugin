name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.4
      - run: go install github.com/mikefarah/yq/v4@v4.47.2
      - run: make check race vuln
      - name: Compile integration tests
        run: go test -tags=e2e -run '^$' ./test/e2e
      - name: Validate shell scripts and workflows
        run: |
          shellcheck scripts/*.sh
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: docker build --build-arg VERSION=0.0.0-ci -t cnpg-connect-plugin:ci .
      - name: Scan the actual image binary
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          container=$(docker create cnpg-connect-plugin:ci)
          trap 'docker rm "$container"' EXIT
          docker cp "$container:/cnpg-connect-plugin" ./image-binary
          govulncheck -mode=binary ./image-binary
      - name: Verify image version
        run: test "$(docker run --rm cnpg-connect-plugin:ci --version)" = 0.0.0-ci

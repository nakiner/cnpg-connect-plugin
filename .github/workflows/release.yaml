name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  publish:
    # Manual runs must select a tag too: source, workflow, Dockerfile and chart
    # always come from the same version. There is no historical rebuild recipe.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.4
      - name: Install release tools
        run: |
          go install github.com/mikefarah/yq/v4@v4.47.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          go install github.com/google/go-containerregistry/cmd/crane@v0.20.3
      - name: Resolve version from this checkout
        id: release
        run: |
          version=${RELEASE_TAG#v}
          [[ $RELEASE_TAG == v* && $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ && ${#version} -le 122 ]]
          [[ $(git rev-parse HEAD) == "$GITHUB_SHA" ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          chart="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/cnpg-connect-plugin"
          printf 'version=%s\nimage=%s\nchart=%s\n' "$version" "$image" "$chart" >> "$GITHUB_OUTPUT"
          printf 'RELEASE_IMAGE=%s\nRELEASE_CHART=%s\n' "$image" "$chart" >> "$GITHUB_ENV"
      - name: Refuse any existing or uncertain publication
        run: scripts/check-publication.sh
      - name: Validate tagged source and packaging
        run: |
          make check race
          govulncheck ./...
          go test -tags=e2e -run '^$' ./test/e2e
      - uses: docker/setup-buildx-action@v4
      # Scan both final binaries before publishing either image. These exact
      # loaded images are pushed after validation; there is no second build.
      - name: Build amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          build-args: VERSION=${{ steps.release.outputs.version }}
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}-amd64
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Build arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          provenance: false
          build-args: VERSION=${{ steps.release.outputs.version }}
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}-arm64
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Scan final image binaries
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p work/binaries
          for arch in amd64 arm64; do
            container=$(docker create --platform "linux/$arch" "$RELEASE_IMAGE:$VERSION-$arch")
            trap 'docker rm "$container"' EXIT
            docker cp "$container:/cnpg-connect-plugin" "work/binaries/plugin-$arch"
            govulncheck -mode=binary "work/binaries/plugin-$arch"
            docker rm "$container"
            trap - EXIT
          done
          scripts/package-chart.sh "$VERSION" "$RELEASE_IMAGE" \
            "$(docker image inspect --format '{{.Id}}' "$RELEASE_IMAGE:$VERSION-amd64")" work/chart-preflight
      - name: Reserve the version
        run: |
          scripts/check-publication.sh
          printf 'Source: %s\nRun: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > work/release-notes.txt
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file work/release-notes.txt
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish scanned images and digest-pinned chart
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker push "$RELEASE_IMAGE:$VERSION-amd64"
          docker push "$RELEASE_IMAGE:$VERSION-arm64"
          amd64=$(crane digest "$RELEASE_IMAGE:$VERSION-amd64")
          arm64=$(crane digest "$RELEASE_IMAGE:$VERSION-arm64")
          docker buildx imagetools create --tag "$RELEASE_IMAGE:$VERSION" "$RELEASE_IMAGE@$amd64" "$RELEASE_IMAGE@$arm64"
          digest=$(crane digest "$RELEASE_IMAGE:$VERSION")
          scripts/package-chart.sh "$VERSION" "$RELEASE_IMAGE" "$digest"
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "work/packages/cnpg-connect-plugin-$VERSION.tgz" "oci://${RELEASE_CHART%/*}"
          mkdir -p work/verify
          helm pull "oci://$RELEASE_CHART" --version "$VERSION" --destination work/verify
          cmp "work/packages/cnpg-connect-plugin-$VERSION.tgz" "work/verify/cnpg-connect-plugin-$VERSION.tgz"
          printf '\nImage: %s@%s\nChart: oci://%s (version %s)\n' \
            "$RELEASE_IMAGE" "$digest" "$RELEASE_CHART" "$VERSION" >> work/release-notes.txt
          gh release upload "$RELEASE_TAG" "work/packages/cnpg-connect-plugin-$VERSION.tgz"
          gh release edit "$RELEASE_TAG" --draft=false --notes-file work/release-notes.txt
          cat work/release-notes.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Log out of Helm registry
        if: always()
        run: helm registry logout ghcr.io || true

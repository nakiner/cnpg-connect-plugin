apiVersion: v1
kind: Namespace
metadata:
  name: databases
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: app-db
  namespace: databases
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie@sha256:42708a75345b7a48fdd9257b071830783a97fd228529196b6313187a7198e185
  storage:
    size: 1Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}
  affinity:
    enablePodAntiAffinity: false
  plugins:
    - name: connect.cnpg.io
      enabled: true
      parameters:
        externalEndpoints: >-
          {"app-db-1":{"host":"127.0.0.1","port":7541,"serverName":"app-db-rw.databases.svc"},
          "app-db-2":{"host":"127.0.0.1","port":7542,"serverName":"app-db-rw.databases.svc"},
          "app-db-3":{"host":"127.0.0.1","port":7543,"serverName":"app-db-rw.databases.svc"}}
---
apiVersion: v1
kind: Service
metadata:
  name: test-pg-1
  namespace: databases
spec:
  type: NodePort
  selector: {cnpg.io/instanceName: app-db-1}
  ports: [{port: 5432, targetPort: 5432, nodePort: 30541}]
---
apiVersion: v1
kind: Service
metadata:
  name: test-pg-2
  namespace: databases
spec:
  type: NodePort
  selector: {cnpg.io/instanceName: app-db-2}
  ports: [{port: 5432, targetPort: 5432, nodePort: 30542}]
---
apiVersion: v1
kind: Service
metadata:
  name: test-pg-3
  namespace: databases
spec:
  type: NodePort
  selector: {cnpg.io/instanceName: app-db-3}
  ports: [{port: 5432, targetPort: 5432, nodePort: 30543}]
---
apiVersion: v1
kind: Service
metadata:
  name: test-discovery
  namespace: cnpg-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: connect
    app.kubernetes.io/name: cnpg-connect-plugin
  ports: [{port: 443, targetPort: 8080, nodePort: 30443}]

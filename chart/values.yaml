# Install in the same namespace as the CloudNativePG operator.
replicaCount: 1
nameOverride: ""
fullnameOverride: ""
image:
  repository: ghcr.io/nakiner/cnpg-connect-plugin
  # Defaults to the chart appVersion. Override for a custom image build.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Empty watches all namespaces and creates a ClusterRole/ClusterRoleBinding.
# Nonempty watches only this namespace and creates a Role/RoleBinding there.
watchNamespace: ""
observer:
  # Direct instance-status refresh for Clusters with discovery consumers.
  # Cluster/Pod metadata arrives through watches; there is no global poll.
  # Durations such as 100ms are supported. Budget per active instance, not per
  # plugin: 6,000 three-instance Clusters at 100ms need about 180,000 probes/s.
  pollInterval: 5s
  # Snapshot validity and the demand lease after a unary GetTopology request.
  ttl: 15s
  # Plugin Pods must reach database Pod IPs on TCP 8000 for these requests.
  probeTimeout: 2s
  # Shared global limit; consumers of the same Cluster reuse one observation.
  maxConcurrency: 128
  # Whole-Cluster collections run separately from the instance probe limit.
  # One eighth of workers/probes (at least one when a limit exceeds one) is
  # reserved for urgent events. Both limits include their reserved capacity.
  maxConcurrentClusters: 32
  # Per Kubernetes client rate/burst for metadata and named public CA reads.
  # Direct instance-status requests do not pass through the Kubernetes API.
  kubeAPIQPS: 20
  kubeAPIBurst: 40

serviceAccount:
  create: true
  name: ""
rbac:
  create: true

application:
  service:
    type: ClusterIP
    port: 443
    annotations: {}
    loadBalancerSourceRanges: []
  auth:
    # Optional legacy shared token. Read-only discovery is tokenless by default.
    existingSecret: ""
    key: token

# Secret names are relative to the release/operator namespace.
# Server Secrets contain tls.crt/tls.key; CNPG1.30 trusts the server tls.crt.
# The client Secret contains tls.crt/tls.key and, with default clientCAKey, ca.crt.
tls:
  plugin:
    existingServerSecret: ""
    existingClientSecret: ""
    # Defaults to existingClientSecret or the generated client Secret.
    clientCASecret: ""
    # Set tls.crt to trust the operator-client leaf directly instead of a CA bundle.
    clientCAKey: ca.crt
  application:
    # Set false behind an HTTP/2 gateway that terminates discovery TLS.
    enabled: true
    existingSecret: ""
    # Include any external LB DNS name used by clients.
    extraDnsNames: []
    extraIPAddresses: []
  certManager:
    enabled: true
    # Creates a private CA and Issuer. Set false and provide issuerRef to use yours.
    createIssuer: true
    issuerRef:
      name: ""
      kind: Issuer
      group: cert-manager.io
    duration: 2160h
    renewBefore: 360h
  clusterDomain: cluster.local

podAnnotations: {}
# Go 1.26 derives GOMAXPROCS from the CPU limit automatically. Do not set a
# fixed GOMAXPROCS env var; it would disable runtime adjustment to limit changes.
# Requests reserve scheduling capacity; they do not configure GOMAXPROCS.
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi
nodeSelector: {}
tolerations: []
affinity: {}
